apiVersion: v1
kind: ServiceAccount
metadata:
  name: infra-collector
  namespace: pharmago
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pharmago-infra-collector
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes/proxy"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pharmago-infra-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pharmago-infra-collector
subjects:
- kind: ServiceAccount
  name: infra-collector
  namespace: pharmago
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-collector
  namespace: pharmago
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: infra-collector
  template:
    metadata:
      labels:
        app: infra-collector
    spec:
      serviceAccountName: infra-collector
      tolerations:
      - key: dedicated
        operator: Equal
        value: ops
        effect: NoSchedule
      - key: dedicated
        operator: Equal
        value: pharmago
        effect: PreferNoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values: [ops, all]
      containers:
      - name: infra-collector
        image: otel/opentelemetry-collector-contrib:latest
        args:
        - "--config=/etc/otel/config.yaml"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        volumeMounts:
        - name: config
          mountPath: /etc/otel
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: infra-collector-config
