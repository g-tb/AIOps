apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: pharmago
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
        jsonData:
          timeInterval: 5s
          queryTimeout: 60s
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: "PharmaGo"
        orgId: 1
        folder: "PharmaGo"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards/pharmago-overview.json

      - name: "PharmaGo Infra"
        orgId: 1
        folder: "PharmaGo"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards/pharmago-infra.json

      - name: "PharmaGo Extended Summary"
        orgId: 1
        folder: "PharmaGo"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards/pharmago-grafana-guide.json

      - name: "Downloaded Node Exporter Full"
        orgId: 1
        folder: "Downloaded Dashboards"
        folderUid: downloaded-dashboards
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards/node-exporter-full_rev46.json

      - name: "Downloaded Prometheus Overview"
        orgId: 1
        folder: "Downloaded Dashboards"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards/prometheus-2-0-overview_rev2.json

      - name: "Downloaded Prometheus Stats"
        orgId: 1
        folder: "Downloaded Dashboards"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards/prometheus-stats_rev2.json
