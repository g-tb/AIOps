apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: pharmago
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
        jsonData:
          timeInterval: 5s
          queryTimeout: 60s
      - name: Jaeger
        type: jaeger
        uid: jaeger
        access: proxy
        url: http://jaeger:16686
        editable: true
        jsonData:
          # "Logs for this span" opens the logs of the whole trace in Elasticsearch.
          # "$$" escapes Grafana's env var interpolation in provisioning files.
          tracesToLogsV2:
            datasourceUid: elasticsearch
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            customQuery: true
            query: 'Scopes.TraceId:"$${__trace.traceId}"'
      - name: Elasticsearch
        type: elasticsearch
        uid: elasticsearch
        access: proxy
        url: http://elasticsearch:9200
        editable: true
        jsonData:
          index: "pharmago-logs-*"
          timeField: "@timestamp"
          logMessageField: Message
          logLevelField: LogLevel
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: 'PharmaGo'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards

