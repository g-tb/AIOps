apiVersion: v1
kind: ConfigMap
metadata:
  name: infra-collector-config
  namespace: pharmago
data:
  config.yaml: |
    receivers:
      prometheus:
        config:
          global:
            scrape_interval: 5s
            scrape_timeout: 4s

          scrape_configs:
            - job_name: node-exporter
              static_configs:
                - targets: ["node-exporter:9100"]

            - job_name: kube-state-metrics
              static_configs:
                - targets: ["kube-state-metrics:8080"]

            - job_name: kubernetes-cadvisor
              kubernetes_sd_configs:
                - role: node
              scheme: https
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              relabel_configs:
                - action: labelmap
                  regex: __meta_kubernetes_node_label_(.+)
                - target_label: __address__
                  replacement: kubernetes.default.svc:443
                - source_labels: [__meta_kubernetes_node_name]
                  regex: (.+)
                  target_label: __metrics_path__
                  replacement: /api/v1/nodes/$${1}/proxy/metrics/cadvisor
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: node

      # Per-pod disk usage (ephemeral storage) from the kubelet summary API. cAdvisor only
      # has write rates per pod. Read through the API server proxy, so the cluster CA
      # validates the certificate; it covers the node this collector runs on.
      kubeletstats:
        collection_interval: 10s
        auth_type: serviceAccount
        endpoint: "kubernetes.default.svc:443/api/v1/nodes/${env:K8S_NODE_NAME}/proxy"
        metric_groups: [pod]

    processors:
      filter/pod-storage:
        error_mode: ignore
        metrics:
          metric:
            - 'not IsMatch(name, "^k8s\\.pod\\.filesystem\\.")'
      # prometheus/infra does not turn resource attributes into labels: copy them with the
      # same label names cAdvisor uses.
      transform/pod-labels:
        error_mode: ignore
        metric_statements:
          - context: datapoint
            statements:
              - set(attributes["namespace"], resource.attributes["k8s.namespace.name"])
              - set(attributes["pod"], resource.attributes["k8s.pod.name"])
      memory_limiter:
        check_interval: 1s
        limit_mib: 192
        spike_limit_mib: 48
      batch:
        timeout: 5s
        send_batch_size: 1024

    exporters:
      otlp:
        endpoint: otlp-collector:4319
        tls:
          insecure: true

    service:
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [memory_limiter, batch]
          exporters: [otlp]
        metrics/pod-storage:
          receivers: [kubeletstats]
          processors: [memory_limiter, filter/pod-storage, transform/pod-labels, batch]
          exporters: [otlp]
