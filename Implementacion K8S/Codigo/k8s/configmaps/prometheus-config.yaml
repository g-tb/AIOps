apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: pharmago
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: otlp-collector
        metrics_path: /metrics
        static_configs:
          - targets: ["otlp-collector:8889"]

      - job_name: infra-otlp
        honor_labels: true
        metrics_path: /metrics
        static_configs:
          - targets: ["otlp-collector:8890"]