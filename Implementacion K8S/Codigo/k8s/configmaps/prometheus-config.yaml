apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: pharmago
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      # Métricas del propio Prometheus, requeridas por los dashboards importados.
      - job_name: prometheus
        static_configs:
          - targets: ["prometheus:9090"]

      - job_name: otlp-collector
        metrics_path: /metrics
        static_configs:
          - targets: ["otlp-collector:8889"]

      - job_name: users-service
        metrics_path: /metrics
        static_configs:
          - targets: ["pharmago-users-service:80"]

      - job_name: pharmacy-service
        metrics_path: /metrics
        static_configs:
          - targets: ["pharmago-pharmacy-service:80"]

      - job_name: api-gateway
        metrics_path: /metrics
        static_configs:
          - targets: ["pharmago-api-gateway:80"]

      - job_name: infra-otlp
        honor_labels: true
        metrics_path: /metrics
        static_configs:
          - targets: ["otlp-collector:8890"]
