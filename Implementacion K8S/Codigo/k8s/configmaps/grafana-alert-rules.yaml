apiVersion: v1
data:
  pharmago-alerts.yaml: |
    apiVersion: 1
    groups:
        - orgId: 1
          name: aiops
          folder: PharmaGo
          interval: 10s
          rules:
            - uid: eg3u55iifa22ob
              title: CPU elevada del nodo
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    editorMode: code
                    expr: |
                      100 * max(rate(container_cpu_usage_seconds_total{job="kubernetes-cadvisor", id="/"}[2m]))
                      / (
                        (max(container_spec_cpu_quota{job="kubernetes-cadvisor", id="/"})
                          / max(container_spec_cpu_period{job="kubernetes-cadvisor", id="/"}))
                        or max(machine_cpu_cores{job="kubernetes-cadvisor"})
                      )
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params: []
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - B
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    reducer: last
                    refId: B
                    type: reduce
                - refId: C
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 85
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: B
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 1m
              annotations:
                summary: "CPU del nodo superior al 85 % de la cuota de minikube durante un minuto."
                description: "cAdvisor del cgroup raíz del nodo (el contenedor de minikube) sobre su cuota de CPU (--cpus). node-exporter ve todas las CPU de la VM, que pueden ser más. Sin cuota, se usan las CPU de la máquina."
              labels: {}
              isPaused: false
            - uid: fg3u5lj2d296ob
              title: Memoria elevada del nodo
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    editorMode: code
                    expr: |
                      100 * max(container_memory_working_set_bytes{job="kubernetes-cadvisor", id="/"})
                      / (
                        max(node_cgroup_memory_max_bytes{job="node-exporter"})
                        or max(machine_memory_bytes{job="kubernetes-cadvisor"})
                      )
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: C
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 85
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 1m
              annotations:
                summary: "Memoria del nodo superior al 85 % del límite de minikube durante un minuto."
                description: "Working set del cgroup raíz del nodo (cAdvisor) sobre su límite (--memory), que publica node-exporter como node_cgroup_memory_max_bytes. MemTotal es la memoria de la VM o del host, que puede ser mayor. Sin límite, se usa la memoria de la máquina."
              labels: {}
              isPaused: false
            - uid: dg3u5x6sdukg0e
              title: Poco espacio disponible en disco
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    editorMode: code
                    expr: "100 *\r\nnode_filesystem_avail_bytes{\r\n  job=\"node-exporter\",\r\n  fstype=~\"ext4|xfs|btrfs\"\r\n}\r\n/\r\nnode_filesystem_size_bytes{\r\n  job=\"node-exporter\",\r\n  fstype=~\"ext4|xfs|btrfs\"\r\n}"
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: C
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 15
                            type: lt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 1m
              annotations:
                summary: Espacio disponible inferior al 15 % durante un minuto
              labels: {}
              isPaused: false
            - uid: fg3u64uftysxsc
              title: Rechazos elevados por rate limiting
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    editorMode: code
                    expr: "sum(\n  (pharmago_http_requests_total{\n    job=\"otlp-collector\",\n    exported_job=\"PharmaGo.ApiGateway\",\n    status_code=\"429\"\n  } unless last_over_time(pharmago_http_requests_total{\n    job=\"otlp-collector\",\n    exported_job=\"PharmaGo.ApiGateway\",\n    status_code=\"429\"\n  }[10m] offset 2m))\n  or increase(pharmago_http_requests_total{\n    job=\"otlp-collector\",\n    exported_job=\"PharmaGo.ApiGateway\",\n    status_code=\"429\"\n  }[2m])\n) or vector(0)"
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: C
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 12
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 30s
              annotations:
                summary: El Gateway registra más de 12 rechazos HTTP 429 en 2 minutos, durante 30 segundos. Cuenta también la primera ráfaga después de un reinicio.
              labels: {}
              isPaused: false
            - uid: bg3u6aoxqfgn4c
              title: Collector OTLP inaccesible
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    editorMode: code
                    expr: 1 - up{job="otlp-collector"}
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: C
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 0.5
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 30s
              annotations:
                summary: Prometheus no pudo consultar las métricas del Collector OTLP durante 30 segundos.
              labels: {}
              isPaused: false
            - uid: pharmago-http-5xx
              title: Errores 5xx en un servicio
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    editorMode: code
                    expr: "sum by (exported_job) (\n  (pharmago_http_requests_total{\n    job=\"otlp-collector\",\n    status_code=~\"5..\"\n  } unless last_over_time(pharmago_http_requests_total{\n    job=\"otlp-collector\",\n    status_code=~\"5..\"\n  }[10m] offset 2m))\n  or increase(pharmago_http_requests_total{\n    job=\"otlp-collector\",\n    status_code=~\"5..\"\n  }[2m])\n) or vector(0)"
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: C
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 5
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 30s
              annotations:
                summary: Un servicio respondió más de 5 errores 5xx en 2 minutos, durante 30 segundos. Cuenta también los primeros errores después de un reinicio.
              labels: {}
              isPaused: false
            - uid: pharmago-pod-cpu
              title: CPU del pod cerca de su límite
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    editorMode: code
                    expr: "100 * max by (pod) (\n  sum by (pod, container) (rate(container_cpu_usage_seconds_total{namespace=\"pharmago\", container!=\"\", container!=\"POD\"}[1m]))\n  / on (pod, container) max by (pod, container) (container_spec_cpu_quota{namespace=\"pharmago\", container!=\"\", container!=\"POD\"} > 0)\n  * on (pod, container) max by (pod, container) (container_spec_cpu_period{namespace=\"pharmago\", container!=\"\", container!=\"POD\"})\n)"
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: C
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 70
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 30s
              annotations:
                summary: Un pod usa más del 70 % de su límite de CPU durante 30 segundos.
              labels: {}
              isPaused: false
            - uid: pharmago-pod-memory
              title: Memoria del pod cerca de su límite
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    editorMode: code
                    expr: "100 * max by (pod) (\n  max by (pod, container) (container_memory_working_set_bytes{namespace=\"pharmago\", container!=\"\", container!=\"POD\"})\n  / on (pod, container) max by (pod, container) (container_spec_memory_limit_bytes{namespace=\"pharmago\", container!=\"\", container!=\"POD\"} > 0)\n)"
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: C
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 85
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 30s
              annotations:
                summary: Un pod usa más del 85 % de su límite de memoria durante 30 segundos.
              labels: {}
              isPaused: false
            - uid: pharmago-container-restart
              title: Contenedor reiniciado o reemplazado
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    editorMode: code
                    expr: "count by (pod) (\n  time() - container_start_time_seconds{namespace=\"pharmago\", container!=\"\", container!=\"POD\", pod!~\"caos-alerta-.*\"} < 120\n) or vector(0)"
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: C
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 0
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 0s
              annotations:
                summary: "Un contenedor de pharmago arrancó hace menos de 2 minutos: se reinició, se reemplazó su pod o hubo un rollout."
                description: "No cuenta los pods de prueba caos-alerta-* de chaos-engineering/alertas: así solo salta la alerta del escenario."
              labels: {}
              isPaused: false
            - uid: pharmago-replicas-unavailable
              title: Réplicas no disponibles
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    editorMode: code
                    expr: "max by (deployment) (\n  max_over_time((\n    kube_deployment_spec_replicas{namespace=\"pharmago\"}\n    - kube_deployment_status_replicas_available{namespace=\"pharmago\"}\n  )[1m:5s])\n)"
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: C
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 0
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 0s
              annotations:
                summary: "A un deployment de pharmago le faltan réplicas disponibles: un pod se cayó, no está listo o no pudo arrancar."
              labels: {}
              isPaused: false
            - uid: pharmago-pod-failed
              title: Pod desalojado o fallido
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    editorMode: code
                    expr: "count by (pod) (\n  kube_pod_status_phase{namespace=\"pharmago\", phase=~\"Failed|Succeeded\"} == 1\n  and on (pod) kube_pod_owner{namespace=\"pharmago\", owner_kind=~\"ReplicaSet|DaemonSet\"}\n) or vector(0)"
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: C
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 0
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 0s
              annotations:
                summary: "Un pod de un Deployment o DaemonSet de pharmago terminó y no se reinicia (fase Failed o Succeeded), por ejemplo desalojado por pasar su límite de ephemeral-storage. Sigue así hasta borrarlo con kubectl delete pod --field-selector=status.phase!=Running,status.phase!=Pending -n pharmago."
              labels: {}
              isPaused: false
        - orgId: 1
          name: aplicacion
          folder: PharmaGo
          interval: 10s
          rules:
            - uid: pharmago-high-error-rate
              title: "Errores 4xx en un servicio"
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    editorMode: code
                    expr: |
                      sum by (exported_job) (
                        (pharmago_http_requests_total{job="otlp-collector", status_code=~"4..", status_code!="429", endpoint=~"/api/.*"}
                          unless last_over_time(pharmago_http_requests_total{job="otlp-collector", status_code=~"4..", status_code!="429", endpoint=~"/api/.*"}[10m] offset 2m))
                        or increase(pharmago_http_requests_total{job="otlp-collector", status_code=~"4..", status_code!="429", endpoint=~"/api/.*"}[2m])
                      ) or vector(0)
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: C
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params: [20]
                          type: gt
                        operator:
                          type: and
                        query:
                          params: [C]
                        reducer:
                          params: []
                          type: last
                        type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 30s
              annotations:
                summary: "Un servicio respondió más de 20 errores 4xx en 2 minutos, durante 30 segundos."
                description: "Solo rutas /api/. No cuenta el 429 (lo cubre la alerta de rate limiting) ni los 5xx (alerta propia). Cuenta también los primeros errores de una serie nueva, como la alerta de 5xx. El uso normal no llega a 20: son logins fallidos aislados."
              labels:
                severity: warning
              isPaused: false
            - uid: pharmago-high-latency
              title: "Latencia P95 elevada de la API"
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    editorMode: code
                    expr: |
                      histogram_quantile(0.95,
                        sum by (le, exported_job) (
                          rate(pharmago_http_request_duration_milliseconds_bucket{job="otlp-collector", endpoint=~"/api/.*"}[2m])
                        )
                      )
                      and on (exported_job) (
                        sum by (exported_job) (increase(pharmago_http_request_duration_milliseconds_count{job="otlp-collector", endpoint=~"/api/.*"}[2m]))
                        - sum by (exported_job) (increase(pharmago_http_request_duration_milliseconds_bucket{job="otlp-collector", endpoint=~"/api/.*", le=~"1000(\\.0)?"}[2m]))
                        >= 3
                      )
                      or vector(0)
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: C
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params: [1000]
                          type: gt
                        operator:
                          type: and
                        query:
                          params: [C]
                        reducer:
                          params: []
                          type: last
                        type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 30s
              annotations:
                summary: "El P95 de la API de un servicio superó un segundo en los últimos 2 minutos, durante 30 segundos."
                description: "Se evalúa por servicio y solo en rutas /api/. Exige al menos 3 solicitudes de más de un segundo en esos 2 minutos: así no la dispara una solicitud lenta aislada, como el primer login después de un rato sin tráfico. Sin tráfico vale 0."
              labels:
                severity: warning
              isPaused: false
            - uid: pharmago-service-down
              title: "Servicio de la app sin endpoints listos"
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    editorMode: code
                    expr: |
                      (
                        kube_endpoint_info{namespace="pharmago", endpoint=~"pharmago-(users-service|pharmacy-service|api-gateway)"}
                        unless on (namespace, endpoint) kube_endpoint_address{ready="true"}
                      )
                      or (absent(kube_endpoint_info{namespace="pharmago"}) unless on () (min_over_time(up{job=~"otlp-collector|infra-otlp"}[2m]) == 0))
                      or vector(0)
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: C
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params: [0]
                          type: gt
                        operator:
                          type: and
                        query:
                          params: [C]
                        reducer:
                          params: []
                          type: last
                        type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 30s
              annotations:
                summary: "El Service de users, pharmacy o el gateway no tiene ningún endpoint listo durante 30 segundos: no le llega tráfico."
                description: "Viene de kube-state-metrics (recurso endpoints). Cubre pods caídos o no Ready y un selector del Service que no apunta a ningún pod. En un rollout normal siempre queda una réplica lista. También salta si no llegan datos de kube-state-metrics (KSM o el infra-collector caídos): sin ellos no se puede confirmar que haya endpoints. No salta por eso con el otlp-collector caído ni en los 2 minutos siguientes, mientras el infra-collector reenvía: esa caída tiene su propia alerta."
              labels:
                severity: critical
              isPaused: false
            - uid: pharmago-db-down
              title: "Base de datos no disponible"
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    editorMode: code
                    expr: |
                      (
                        kube_endpoint_info{namespace="pharmago", endpoint="pharmago-db"}
                        unless on (namespace, endpoint) kube_endpoint_address{ready="true"}
                      )
                      or vector(0)
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: C
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params: [0]
                          type: gt
                        operator:
                          type: and
                        query:
                          params: [C]
                        reducer:
                          params: []
                          type: last
                        type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 30s
              annotations:
                summary: "El Service pharmago-db no tiene ningún endpoint listo durante 30 segundos: users y pharmacy no llegan a la base de datos y responden 500. Ver RB13 en docs/plan-contencion.md."
                description: "Viene de kube-state-metrics (recurso endpoints), como la alerta de servicios sin endpoints. La readiness de la DB ejecuta SELECT 1 con sqlcmd, así que también salta si SQL Server está colgado aunque el puerto acepte conexiones. La DB tiene una sola réplica: no hay otra que atienda."
              labels:
                severity: critical
              isPaused: false

