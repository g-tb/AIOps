apiVersion: v1
data:
  pharmago-alerts.yaml: |
    apiVersion: 1
    groups:
        - orgId: 1
          name: aiops
          folder: PharmaGo
          interval: 10s
          rules:
            - uid: eg3u55iifa22ob
              title: CPU elevada del nodo
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    editorMode: code
                    expr: "100 * (\r\n  1 - avg by (instance) (\r\n    rate(node_cpu_seconds_total{\r\n      job=\"node-exporter\",\r\n      mode=\"idle\"\r\n    }[2m])\r\n  )\r\n)"
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params: []
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - B
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    reducer: last
                    refId: B
                    type: reduce
                - refId: C
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 85
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: B
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 1m
              annotations:
                summary: CPU del nodo superior al 85 % durante un minuto.
              labels: {}
              isPaused: false
            - uid: fg3u5lj2d296ob
              title: Memoria elevada del nodo
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    editorMode: code
                    expr: "100 * (\r\n  1 -\r\n  node_memory_MemAvailable_bytes{job=\"node-exporter\"}\r\n  /\r\n  node_memory_MemTotal_bytes{job=\"node-exporter\"}\r\n)"
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: C
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 85
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 1m
              annotations:
                summary: Memoria usada del nodo superior al 85 % durante un minuto
              labels: {}
              isPaused: false
            - uid: dg3u5x6sdukg0e
              title: Poco espacio disponible en disco
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    editorMode: code
                    expr: "100 *\r\nnode_filesystem_avail_bytes{\r\n  job=\"node-exporter\",\r\n  fstype=~\"ext4|xfs|btrfs\"\r\n}\r\n/\r\nnode_filesystem_size_bytes{\r\n  job=\"node-exporter\",\r\n  fstype=~\"ext4|xfs|btrfs\"\r\n}"
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: C
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 15
                            type: lt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 1m
              annotations:
                summary: Espacio disponible inferior al 15 % durante un minuto
              labels: {}
              isPaused: false
            - uid: fg3u64uftysxsc
              title: Rechazos elevados por rate limiting
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    editorMode: code
                    expr: "sum(\n  (pharmago_http_requests_total{\n    job=\"otlp-collector\",\n    exported_job=\"PharmaGo.ApiGateway\",\n    status_code=\"429\"\n  } unless pharmago_http_requests_total{\n    job=\"otlp-collector\",\n    exported_job=\"PharmaGo.ApiGateway\",\n    status_code=\"429\"\n  } offset 2m)\n  or increase(pharmago_http_requests_total{\n    job=\"otlp-collector\",\n    exported_job=\"PharmaGo.ApiGateway\",\n    status_code=\"429\"\n  }[2m])\n) or vector(0)"
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: C
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 12
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 30s
              annotations:
                summary: El Gateway registra más de 12 rechazos HTTP 429 en 2 minutos, durante 30 segundos. Cuenta también la primera ráfaga después de un reinicio.
              labels: {}
              isPaused: false
            - uid: bg3u6aoxqfgn4c
              title: Collector OTLP inaccesible
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    editorMode: code
                    expr: 1 - up{job="otlp-collector"}
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: C
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 0.5
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 30s
              annotations:
                summary: Prometheus no pudo consultar las métricas del Collector OTLP durante 30 segundos.
              labels: {}
              isPaused: false
            - uid: pharmago-http-5xx
              title: Errores 5xx en un servicio
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    editorMode: code
                    expr: "sum by (exported_job) (\n  (pharmago_http_requests_total{\n    job=\"otlp-collector\",\n    status_code=~\"5..\"\n  } unless pharmago_http_requests_total{\n    job=\"otlp-collector\",\n    status_code=~\"5..\"\n  } offset 2m)\n  or increase(pharmago_http_requests_total{\n    job=\"otlp-collector\",\n    status_code=~\"5..\"\n  }[2m])\n) or vector(0)"
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: C
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 5
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 30s
              annotations:
                summary: Un servicio respondió más de 5 errores 5xx en 2 minutos, durante 30 segundos. Cuenta también los primeros errores después de un reinicio.
              labels: {}
              isPaused: false
            - uid: pharmago-pod-cpu
              title: CPU del pod cerca de su límite
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    editorMode: code
                    expr: "100 * max by (pod) (\n  rate(container_cpu_usage_seconds_total{namespace=\"pharmago\", container!=\"\", container!=\"POD\"}[1m])\n  / on (pod, container) (container_spec_cpu_quota{namespace=\"pharmago\", container!=\"\", container!=\"POD\"} > 0)\n  * on (pod, container) container_spec_cpu_period{namespace=\"pharmago\", container!=\"\", container!=\"POD\"}\n)"
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: C
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 70
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 30s
              annotations:
                summary: Un pod usa más del 70 % de su límite de CPU durante 30 segundos.
              labels: {}
              isPaused: false
            - uid: pharmago-pod-memory
              title: Memoria del pod cerca de su límite
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    editorMode: code
                    expr: "100 * max by (pod) (\n  container_memory_working_set_bytes{namespace=\"pharmago\", container!=\"\", container!=\"POD\"}\n  / on (pod, container) (container_spec_memory_limit_bytes{namespace=\"pharmago\", container!=\"\", container!=\"POD\"} > 0)\n)"
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: C
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 85
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 30s
              annotations:
                summary: Un pod usa más del 85 % de su límite de memoria durante 30 segundos.
              labels: {}
              isPaused: false
            - uid: pharmago-container-restart
              title: Contenedor reiniciado o reemplazado
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    editorMode: code
                    expr: "count by (pod) (\n  time() - container_start_time_seconds{namespace=\"pharmago\", container!=\"\", container!=\"POD\"} < 120\n) or vector(0)"
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: C
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 0
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 0s
              annotations:
                summary: "Un contenedor de pharmago arrancó hace menos de 2 minutos: se reinició, se reemplazó su pod o hubo un rollout."
              labels: {}
              isPaused: false
            - uid: pharmago-replicas-unavailable
              title: Réplicas no disponibles
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    editorMode: code
                    expr: "max by (deployment) (\n  max_over_time((\n    kube_deployment_spec_replicas{namespace=\"pharmago\"}\n    - kube_deployment_status_replicas_available{namespace=\"pharmago\"}\n  )[1m:5s])\n)"
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: C
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 0
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 0s
              annotations:
                summary: "A un deployment de pharmago le faltan réplicas disponibles: un pod se cayó, no está listo o no pudo arrancar."
              labels: {}
              isPaused: false
kind: ConfigMap
metadata:
  name: grafana-alert-rules
  namespace: pharmago
