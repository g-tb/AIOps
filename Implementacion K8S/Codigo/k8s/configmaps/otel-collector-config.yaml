apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: pharmago
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"

      otlp/infra:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4319"

    processors:
      batch: {}

    exporters:
      prometheus:
        endpoint: "0.0.0.0:8889"

      prometheus/infra:
        endpoint: "0.0.0.0:8890"

      debug: {}

      otlp/jaeger:
        endpoint: "jaeger:4317"
        tls:
          insecure: true

    service:
      pipelines:
        metrics:
          receivers: [otlp]
          exporters: [prometheus, debug]

        metrics/infra:
          receivers: [otlp/infra]
          processors: [batch]
          exporters: [prometheus/infra]

        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/jaeger]