apiVersion: 1
groups:
    - orgId: 1
      name: aiops
      folder: PharmaGo
      interval: 10s
      rules:
        - uid: eg3u55iifa22ob
          title: CPU elevada del nodo
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus
              model:
                editorMode: code
                expr: "100 * (\r\n  1 - avg by (instance) (\r\n    rate(node_cpu_seconds_total{\r\n      job=\"node-exporter\",\r\n      mode=\"idle\"\r\n    }[2m])\r\n  )\r\n)"
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - B
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                type: reduce
            - refId: C
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 85
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            summary: CPU del nodo superior al 85 % durante un minuto.
          labels: {}
          isPaused: false
        - uid: fg3u5lj2d296ob
          title: Memoria elevada del nodo
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus
              model:
                editorMode: code
                expr: "100 * (\r\n  1 -\r\n  node_memory_MemAvailable_bytes{job=\"node-exporter\"}\r\n  /\r\n  node_memory_MemTotal_bytes{job=\"node-exporter\"}\r\n)"
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 85
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            summary: Memoria usada del nodo superior al 85 % durante un minuto
          labels: {}
          isPaused: false
        - uid: dg3u5x6sdukg0e
          title: Poco espacio disponible en disco
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus
              model:
                editorMode: code
                expr: "100 *\r\nnode_filesystem_avail_bytes{\r\n  job=\"node-exporter\",\r\n  fstype=~\"ext4|xfs|btrfs\"\r\n}\r\n/\r\nnode_filesystem_size_bytes{\r\n  job=\"node-exporter\",\r\n  fstype=~\"ext4|xfs|btrfs\"\r\n}"
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 15
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            summary: Espacio disponible inferior al 15 % durante un minuto
          labels: {}
          isPaused: false
        - uid: fg3u64uftysxsc
          title: Rechazos elevados por rate limiting
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus
              model:
                editorMode: code
                expr: "sum(\r\n  rate(pharmago_http_requests_total{\r\n    job=\"otlp-collector\",\r\n    exported_job=\"PharmaGo.ApiGateway\",\r\n    status_code=\"429\"\r\n  }[2m])\r\n) or vector(0)"
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0.1
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 30s
          annotations:
            summary: El Gateway registra más de 0,1 rechazos HTTP 429 por segundo durante 30 segundos.
          labels: {}
          isPaused: false
        - uid: bg3u6aoxqfgn4c
          title: Collector OTLP inaccesible
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus
              model:
                editorMode: code
                expr: 1 - up{job="otlp-collector"}
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0.5
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 30s
          annotations:
            summary: Prometheus no pudo consultar las métricas del Collector OTLP durante 30 segundos.
          labels: {}
          isPaused: false
    - orgId: 1
      name: aplicacion
      folder: PharmaGo
      interval: 10s
      rules:
        - uid: pharmago-high-error-rate
          title: "Alta tasa de errores de la API"
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus
              model:
                editorMode: code
                expr: |
                  (sum(rate(pharmago_http_errors_total{endpoint=~"/api/.*"}[5m])) or vector(0))
                  / sum(rate(pharmago_http_requests_total{endpoint=~"/api/.*"}[5m])) * 100
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                  - evaluator:
                      params: [5]
                      type: gt
                    operator:
                      type: and
                    query:
                      params: [C]
                    reducer:
                      params: []
                      type: last
                    type: query
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 5m
          annotations:
            summary: "Más del 5% de solicitudes API terminan con error durante cinco minutos."
            description: "Errores 4xx, 5xx y excepciones registrados por el middleware, sobre el total de solicitudes /api/. El numerador vale cero si aún no hay serie de errores. Sin solicitudes no hay porcentaje definido. Se usa solo la vía OTLP de estas métricas; no se suman los exportadores directos."
          labels:
            severity: warning
          isPaused: false
        - uid: pharmago-high-latency
          title: "Latencia P95 elevada de la API"
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus
              model:
                editorMode: code
                expr: |
                  histogram_quantile(0.95,
                    sum by (le, exported_job) (
                      rate(pharmago_http_request_duration_milliseconds_bucket{endpoint=~"/api/.*"}[5m])
                    )
                  )
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                  - evaluator:
                      params: [1000]
                      type: gt
                    operator:
                      type: and
                    query:
                      params: [C]
                    reducer:
                      params: []
                      type: last
                    type: query
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 5m
          annotations:
            summary: "P95 de la API superior a un segundo durante cinco minutos."
            description: "Se evalúa por servicio. Los histogramas están en milisegundos: 1000 ms equivale a un segundo. Solo rutas /api/. Sin tráfico la latencia puede no estar definida."
          labels:
            severity: warning
          isPaused: false
        - uid: pharmago-service-down
          title: "Servicio de aplicación inaccesible"
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus
              model:
                editorMode: code
                expr: |
                  up{job=~"users-service|pharmacy-service|api-gateway"}
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                  - evaluator:
                      params: [0.5]
                      type: lt
                    operator:
                      type: and
                    query:
                      params: [C]
                    reducer:
                      params: []
                      type: last
                    type: query
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            summary: "Prometheus no puede consultar un servicio de aplicación durante un minuto."
            description: "Una instancia de alerta por destino: Users, Pharmacy y Gateway. up=0 indica fallo del scraping; up=1 solo confirma que /metrics responde, no que todas las funcionalidades o réplicas estén sanas."
          labels:
            severity: critical
          isPaused: false
