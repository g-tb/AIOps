# JSON access log: Fluent Bit lifts the "log" line to fields (http.status, http.uri, ...).
# Everything goes under "http" so it does not collide with fields other pods already use.
log_format json_access escape=json
  '{"http":{"client_ip":"$remote_addr","method":"$request_method","uri":"$request_uri",'
  '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
  '"user_agent":"$http_user_agent","referer":"$http_referer","forwarded_for":"$http_x_forwarded_for"}}';

# Kubelet probes hit "/" every few seconds; they are ~99% of the access log.
map $http_user_agent $loggable {
  ~^kube-probe 0;
  default      1;
}

server {
  listen       80;
  server_name  localhost 127.0.0.1;
  root   /usr/share/nginx/html;
  index  index.html;

  access_log /var/log/nginx/access.log json_access if=$loggable;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
